name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Test & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Workspace packages expose dist/ entry points. Build those before tests
      # that import the validator package through its public workspace export.
      - name: Build packages
        run: pnpm -r build && pnpm build

      - name: Run Vitest Suite
        run: pnpm test

      - name: Dry-run package pack
        run: npm pack --dry-run

      - name: Package Smoke Test
        run: |
          PACK_DIR=$(mktemp -d)
          pnpm pack --pack-destination "$PACK_DIR"
          TARBALL=$(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          npm init -y
          npm install "$TARBALL"
          node --input-type=module -e "
            import * as Root from '@ultrst-armada/frnlts';
            import * as Runtime from '@ultrst-armada/frnlts/runtime';
            import * as React from '@ultrst-armada/frnlts/react';

            if (typeof Root.createLifecycle !== 'function') throw new Error('Missing Root.createLifecycle');
            if (typeof Root.registerFrnlTheme !== 'function') throw new Error('Missing Root.registerFrnlTheme');
            if (typeof Runtime.createScope !== 'function') throw new Error('Missing Runtime.createScope');
            if (typeof Runtime.applyFrnlTheme !== 'function') throw new Error('Missing Runtime.applyFrnlTheme');
            if (typeof React.useFrnlComponent !== 'function') throw new Error('Missing React.useFrnlComponent');
            console.log('CI Smoke test passed successfully!');
          "
          rm -rf "$TEMP_DIR" "$PACK_DIR"
